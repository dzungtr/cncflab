# ClickStack Helm values — local/dev cluster overrides
# Tuned for kind, k3s, or minikube; not suitable for production use as-is.
# Chart: clickstack/clickstack (v2.x)
# Ref: https://clickhouse.com/docs/use-cases/observability/clickstack/deployment/helm

# ---------------------------------------------------------------------------
# HyperDX (observability UI + API)
# ---------------------------------------------------------------------------
hyperdx:
  # Single replica is sufficient for local dev
  deployment:
    replicas: 1

  resources:
    limits:
      cpu: "500m"
      memory: 512Mi
    requests:
      cpu: "100m"
      memory: 256Mi

  # No TLS for local dev
  ingress:
    enabled: false

  # Disable persistent sessions storage — use in-memory only
  persistence:
    enabled: false

# ---------------------------------------------------------------------------
# ClickHouse (storage)
# Managed by the ClickHouse Operator via ClickHouseCluster CR
# ---------------------------------------------------------------------------
clickhouse:
  # Single shard, single replica
  shards: 1
  replicas: 1

  # Small storage for local dev (5Gi)
  persistence:
    enabled: true
    size: 5Gi
    # Uncomment and set to your local storage class if needed:
    # storageClass: standard

  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: "250m"
      memory: 512Mi

  # No TLS for local dev
  tls:
    enabled: false

# ---------------------------------------------------------------------------
# MongoDB (HyperDX metadata store)
# Managed by the MongoDB Community Kubernetes Operator (MCK)
# ---------------------------------------------------------------------------
mongodb:
  # Single-member replica set is the minimum for the operator
  members: 1

  persistence:
    storage: 2Gi
    # Uncomment and set to your local storage class if needed:
    # storageClass: standard

  resources:
    limits:
      cpu: "500m"
      memory: 512Mi
    requests:
      cpu: "100m"
      memory: 256Mi

# ---------------------------------------------------------------------------
# OpenTelemetry Collector (ingestion)
# Deployed as a subchart via the official OTel Collector Helm chart
# ---------------------------------------------------------------------------
opentelemetry-collector:
  # DaemonSet mode collects from all nodes; Deployment is simpler for local dev
  mode: deployment

  replicaCount: 1

  resources:
    limits:
      cpu: "500m"
      memory: 256Mi
    requests:
      cpu: "50m"
      memory: 128Mi

  # Expose OTLP gRPC and HTTP receiver ports within the cluster
  ports:
    otlp:
      enabled: true
    otlp-http:
      enabled: true
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
